name: IndexNow after production
on:
  repository_dispatch:
    types: [vercel.deployment.success, vercel.deployment.promoted]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: indexnow-pokebonk-production
  cancel-in-progress: false
jobs:
  notify:
    if: github.repository == 'wanghuan072/pokebonk' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch' && github.event.sender.login == 'vercel[bot]' && github.event.client_payload.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find last fully accepted notification
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const runs=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'indexnow.yml',branch:'main',status:'success',per_page:100});
            for(const run of runs.data.workflow_runs.sort((a,b)=>b.id-a.id)){
              if(run.path!=='.github/workflows/indexnow.yml')continue;
              const artifacts=await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:run.id});
              const artifact=artifacts.data.artifacts.filter(a=>!a.expired&&a.name.startsWith('indexnow-state-')).sort((a,b)=>b.id-a.id)[0];
              if(artifact){core.setOutput('run',String(run.id));core.setOutput('name',artifact.name);return;}
            }
            core.notice('No retained successful state: resubmit current URLs and outstanding deletions without changing sitemap dates.');
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run }}
          name: ${{ steps.previous.outputs.name }}
          path: .indexnow/previous
      - name: Notify changed production pages
        run: node scripts/indexnow/notify.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .indexnow/accepted.json
          if-no-files-found: ignore
          retention-days: 90
